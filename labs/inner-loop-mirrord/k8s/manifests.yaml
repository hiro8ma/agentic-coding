apiVersion: v1
kind: Namespace
metadata:
  name: agentlab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
  namespace: agentlab
data:
  GREETING: "クラスタの ConfigMap から来た値"
  UPSTREAM_URL: "http://upstream.agentlab.svc.cluster.local"
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
  namespace: agentlab
type: Opaque
stringData:
  API_TOKEN: "lab-token-1234567890"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upstream
  namespace: agentlab
spec:
  replicas: 1
  selector:
    matchLabels: { app: upstream }
  template:
    metadata:
      labels: { app: upstream }
    spec:
      containers:
        - name: upstream
          image: labdemo:local
          imagePullPolicy: Never
          env:
            - name: MODE
              value: upstream
            - name: PORT
              value: "80"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: upstream
  namespace: agentlab
spec:
  selector: { app: upstream }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: agentlab
spec:
  replicas: 1
  selector:
    matchLabels: { app: demo-app }
  template:
    metadata:
      labels: { app: demo-app }
    spec:
      containers:
        - name: demo-app
          image: labdemo:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: demo-config }
            - secretRef: { name: demo-secret }
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: token
              mountPath: /etc/demo
              readOnly: true
      volumes:
        - name: token
          secret:
            secretName: demo-secret
            items:
              - key: API_TOKEN
                path: token
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: agentlab
spec:
  selector: { app: demo-app }
  ports:
    - port: 80
      targetPort: 8080
